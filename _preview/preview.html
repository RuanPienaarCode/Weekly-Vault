<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fortnight — preview</title>
<link rel="stylesheet" href="fortnight.css">
<style>
  html, body { margin: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0b0b0d; color: #ddd;
    --text-normal: #ddd; --text-muted: #999; --text-faint: #666; --background-primary: #1e1e1e; --background-secondary: #262626;
    --background-modifier-hover: #2e2e2e; --background-modifier-border: #383838; --text-accent: #7aa7ff; --interactive-accent: #5b7cfa; --text-on-accent: #fff; }
  body.theme-light { background: #e9e8e4; color: #222; --text-normal: #222; --text-muted: #666; --text-faint: #999; --background-primary: #fff; --background-secondary: #f4f4f4;
    --background-modifier-hover: #ececec; --background-modifier-border: #ddd; }
  .frame { position: absolute; top: 18px; right: 18px; bottom: 18px; left: 18px; border-radius: 14px; overflow: auto; box-shadow: 0 10px 46px rgba(0,0,0,.5); background: var(--background-primary); }
  body.is-mobile .frame { max-width: 375px; margin: 0 auto; }
</style>
</head>
<body class="theme-dark">
<div class="frame"><div id="app" class="view-content"></div></div>
<script src="bundle.js"></script>
</body>
</html>
